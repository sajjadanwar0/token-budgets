[package]
name        = "token-budgets"
version     = "0.5.0"
edition     = "2024"

[dependencies]
tiktoken-rs = { version = "0.11.0", optional = true }
anyhow      = "1"

[target.'cfg(not(loom))'.dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[dev-dependencies]
criterion   = "0.8.2"
trybuild    = "1.0"

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
default = []
tiktoken = ["dep:tiktoken-rs"]
system-authority = []

[[bench]]
name = "spend_bench"
harness = false
required-features = ["system-authority"]

[[test]]
name = "compile_fail"
required-features = ["system-authority"]

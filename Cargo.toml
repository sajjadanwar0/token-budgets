[package]
name        = "token-budgets"
version     = "0.5.0"
edition     = "2024"

[dependencies]
tiktoken-rs = { version = "0.11.0", optional = true }
anyhow      = "1"
loom = "0.7.2"
tokio = { version = "1", features = ["rt", "macros"] }


[dev-dependencies]
criterion   = "0.8.2"
trybuild = "1.0"


[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
default = []
tiktoken = ["dep:tiktoken-rs"]

[[bench]]
name = "spend_bench"
harness = false